name: Mise à jour quotidienne des ressources

on:
  schedule:
    # Tous les jours à 06:00 UTC (08:00 heure de Paris en été, 07:00 en hiver)
    - cron: "0 6 * * *"
  workflow_dispatch:  # bouton manuel "Run workflow" depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Installation des dépendances
        run: pip install -r scripts/requirements.txt

      - name: Lecture Gmail + mise à jour de data.json
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit et push si data.json a changé
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Mise à jour automatique des ressources"
            git push
          else
            echo "Aucun changement à committer."
          fi
